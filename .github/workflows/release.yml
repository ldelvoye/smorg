name: release
on:
  release:
    types: [published]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # --frozen so CI resolves exactly what uv.lock pins; without it the
      # lockfile is committed but never actually exercised.
      - run: uv sync --all-extras --dev --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -v

  publish:
    needs: gates
    runs-on: ubuntu-latest
    environment: pypi
    # A job-level permissions block zeroes the defaults, so contents: read must
    # be spelled out for checkout; id-token: write is what OIDC trusted
    # publishing needs.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # Belt-and-braces: fail before building if the release tag and
      # pyproject.toml's version have drifted apart.
      - run: |
          tag="v$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match pyproject.toml version $tag"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: uv export --frozen --no-dev --no-emit-project --output-file requirements.txt
      # --clobber so a re-run of this job replaces the asset instead of failing.
      - run: gh release upload --clobber "$GITHUB_REF_NAME" requirements.txt
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ldelvoye/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - run: |
          VERSION="$(uv version --short)"
          SDIST_SHA256="$(sha256sum "dist/smorg-${VERSION}.tar.gz" | cut -d' ' -f1)"
          REQUIREMENTS_SHA256="$(sha256sum requirements.txt | cut -d' ' -f1)"
          export VERSION SDIST_SHA256 REQUIREMENTS_SHA256
          envsubst "\${VERSION} \${SDIST_SHA256} \${REQUIREMENTS_SHA256}" \
            < packaging/homebrew/smorg.rb > tap/Formula/smorg.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/smorg.rb
          # A re-run renders an identical formula; skip the empty commit.
          if ! git diff --cached --quiet; then
            git commit -m "smorg ${VERSION}"
            git push
          fi
